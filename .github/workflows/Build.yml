name: Build and Release

# Single deterministic release path: pushing a `v*` tag builds the APK and
# creates (or updates) a GitHub Release under that exact tag. There is no
# `release: published` trigger, so a release can never be published under a
# hand-typed tag (v1.0.2 was tagged `opensource`, v1.0.3 was tagged `bug`,
# and another release was tagged `laya`) — the in-app updater only
# understands `vX.Y.Z` tags, and a mismatched tag silently breaks the
# update check. With this workflow, the tag IS the version, by construction.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    env:
      # ── Signing secrets (set these in GitHub → Settings → Secrets) ──────
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # ── YTM API key (set in GitHub → Settings → Secrets) ────────────────
      YTM_API_KEY: ${{ secrets.YTM_API_KEY }}
      # SHA-256 fingerprint of the app's release signing certificate
      # (CN=Laya Music, C=CA). This is PUBLIC information — it ships inside
      # every APK — and it is the identity every installed copy must carry.
      # Every release since v1.0.2 must be signed with this one key. The
      # Verify signing certificate step below FAILS the build if the produced
      # APK was signed by anything else, so a future key swap has to be a
      # deliberate, documented act instead of a silent CI change that breaks
      # in-place updates for every existing user.
      EXPECTED_SIGNING_FINGERPRINT: "0b4c236a30842911b3f3f394aed3d69ad33c63d5897acc4b3bf5232064b01a21"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK (stable components)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 (preview channel)
        # SDK 37 (Android 17) ships on channel 3; the stable setup-android
        # action only installs channel-0 packages, so we install it manually.
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" 2>/dev/null || \
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=3 \
            "platforms;android-37.0" 2>/dev/null || true

      - name: Write local.properties
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Decode release keystore
        # Decode the base64-encoded release keystore secret into the exact
        # path app/build.gradle.kts reads ($rootDir/laya-release.jks). The
        # secret is passed through env — never echoed into the logs — and the
        # step fails fast when the secret is missing or decodes empty, so a
        # misconfigured release build can't silently fall back to the debug
        # key (that silent fallback is what shipped the debug-key-signed
        # v1.0.3 APK and caused the v1.0.3 → v1.0.4 signature mismatch).
        # The keystore is removed from the workspace again after the build.
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — release builds cannot be signed."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > laya-release.jks
          test -s laya-release.jks || { echo "::error::Decoded laya-release.jks is empty — check the secret."; exit 1; }

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        # The `github` flavor is the default distribution with self-update
        # enabled; the `store` flavor is Play-Store-only and must not be built
        # here (it also has no self-update permission).
        # The Gradle fail-fast signing check (app/build.gradle.kts) aborts here
        # if the keystore or any signing secret is missing/misconfigured.
        run: ./gradlew assembleGithubRelease --stacktrace --no-daemon

      - name: Verify signing certificate
        # Auditability + enforcement of the signing identity:
        #   1. prints the signing certificate's SHA-256 fingerprint (public
        #      info only — never the keystore file or passwords) so every
        #      release's signing identity is visible in this workflow log;
        #   2. fails the build if the APK was signed with anything other than
        #      the pinned key — catching a swapped keystore secret, a stale
        #      artifact, or a silent debug-key fallback the moment it happens
        #      instead of days later as a user-facing install failure.
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find app/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          test -n "$apk_path" || { echo "::error::No APK found in app/build/outputs/apk/github/release"; exit 1; }

          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$apksigner" || { echo "::error::apksigner not found in build-tools"; exit 1; }

          # Fingerprint of the certificate that actually signed the APK
          # (APK Signature Scheme v2/v3 block — keytool cannot read it).
          apk_fp=$("$apksigner" verify --print-certs "$apk_path" \
            | grep -iE "SHA-256 digest" | head -n 1 | sed -E 's/.*digest:[[:space:]]*//' | tr -d '\r')

          # Fingerprint of the certificate inside the keystore we signed
          # with. -storepass:env keeps the password out of the process list
          # and the logs; a wrong password or wrong alias fails here.
          keytool -exportcert -keystore laya-release.jks -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -rfc -file /tmp/signing-cert.pem
          ks_fp=$(openssl x509 -in /tmp/signing-cert.pem -noout -fingerprint -sha256 \
            | sed -E 's/.*=//' | tr -d ':' | tr 'A-F' 'a-f')

          apk_fp_norm=$(printf '%s' "$apk_fp" | tr -d ':' | tr 'A-F' 'a-f')

          echo "APK signing certificate SHA-256: $apk_fp"
          echo "Keystore certificate SHA-256:    $ks_fp"
          echo "Expected (pinned):               $EXPECTED_SIGNING_FINGERPRINT"

          test "$apk_fp_norm" = "$ks_fp" || {
            echo "::error::The APK certificate does not match the keystore certificate — stale artifact or wrong keystore file."
            exit 1
          }
          test "$apk_fp_norm" = "$EXPECTED_SIGNING_FINGERPRINT" || {
            echo "::error::The APK was signed with an unexpected certificate. In-place updates will fail for every existing user. If you deliberately rotated the signing key, update EXPECTED_SIGNING_FINGERPRINT in this workflow and document the migration."
            exit 1
          }
          echo "✔ APK is signed with the authoritative release key ($EXPECTED_SIGNING_FINGERPRINT)"

      - name: Remove keystore from workspace
        # Never persist the keystore: delete it from the workspace right after
        # the build, before any artifact staging/upload step. Only
        # build-artifacts/laya-music-release.apk is uploaded, so the .jks never
        # leaves the ephemeral runner.
        run: rm -f laya-release.jks

      - name: Stage APK
        run: |
          mkdir -p build-artifacts
          apk_path=$(find app/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found in app/build/outputs/apk/github/release"
            exit 1
          fi
          cp "$apk_path" build-artifacts/laya-music-release.apk
          echo "APK: $apk_path"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laya-music-release-apk
          path: build-artifacts/laya-music-release.apk

      - name: Create GitHub Release and Upload APK
        # Runs only on `v*` tag pushes — the single, deterministic release
        # path. The release is created under the pushed tag, so the tag is
        # exactly the version by construction and the in-app updater (which
        # reads tag_name from /releases/latest) works. The release body
        # comes from RELEASE_NOTES.md — edit that file before tagging.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/laya-music-release.apk
          body_path: RELEASE_NOTES.md
